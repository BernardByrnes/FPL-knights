name: Refresh FPL data
on:
  schedule:
    - cron: '30 8,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - run: npm test
      - name: Commit verified snapshot
        run: |
          if ! git diff --quiet -- public/data/season.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/data/season.json
            git commit -m 'Refresh FPL data'
            git push
          fi
